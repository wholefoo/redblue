# The project dogfoods its own gate. The platform app is launched in-process as the preview.
stack: fastapi
app: redblue.platform.app:app
severity_threshold: high
paths: [packages, admin]
exclude: ["examples/*", "**/tests/*", "evals/*"]
spend_limit_usd: 1.0
probe_paths: ["/", "/search", "/sitemap.xml", "/robots.txt", "/llms.txt"]
ignore:
  - fingerprint: 1ccc391c5eb0a1bd
    reason: >-
      builder/scaffold.py renders Python, YAML and Markdown project files, not HTML;
      autoescaping would corrupt generated code. Inputs are the validated BuildPlan.
  - rule_id: ZAP-90004-2  # Cross-Origin-Embedder-Policy (-1 is CORP, -3 is COOP)
    reason: >-
      Cross-Origin-Embedder-Policy would block the YouTube and Vimeo embeds that content
      blocks allow (frame-src), including in the admin draft preview. The site uses no
      features that need cross-origin isolation; Cross-Origin-Opener-Policy is set.
  - rule_id: ZAP-10110
    path: /static/rb/htmx.min.js
    reason: >-
      Vendored htmx library. ZAP spots its eval-style code paths (hx-on, js: values); the
      site doesn't use them and the CSP has no 'unsafe-eval', so the browser refuses them.
